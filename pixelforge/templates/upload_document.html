{% extends 'base.html' %}
{% block body_block %}

<div class="container mt-5">

    <!-- Page Header -->
    <div class="mb-4">
        <h2 class="fw-bold">Upload Document</h2>
        <p class="text-muted">
            Project: <span class="fw-semibold">{{ project.name }}</span>
        </p>
    </div>

    <!-- Card -->
    <div class="card shadow-sm border-0">
        <div class="card-header bg-info text-white">
            <h5 class="mb-0">Add New File</h5>
        </div>

        <div class="card-body">

            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}

                <!-- File Input -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Select File</label>
                    {{ form.file }}
                    <div class="form-text">
                        Supported formats: PDF, DOCX, TXT, etc.
                    </div>
                </div>

                <!-- Buttons -->
                <div class="d-flex justify-content-between">
                    <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">
                        ← Back
                    </a>

                    <button type="submit" class="btn btn-info text-white">
                        Upload File
                    </button>
                </div>

            </form>

        </div>
    </div>

</div>

{% endblock %}
